    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      data-dailyhot-theme-color
      content="#ffffff"
    />
    <script>
      (() => {
        const resolveInitialTheme = () => {
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          try {
            const persisted = JSON.parse(localStorage.getItem("mainData") || "null");
            if (persisted?.siteThemeAuto !== false) {
              return prefersDark ? "dark" : "light";
            }
            return persisted?.siteTheme === "dark" ? "dark" : "light";
          } catch {
            return prefersDark ? "dark" : "light";
          }
        };

        const theme = resolveInitialTheme();
        const root = document.documentElement;
        root.dataset.dailyhotTheme = theme;
        root.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"][data-dailyhot-theme-color]')
          ?.setAttribute("content", theme === "dark" ? "#101014" : "#ffffff");
      })();
    </script>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        background: #ffffff;
      }

      html[data-dailyhot-theme="dark"],
      html[data-dailyhot-theme="dark"] body,
      html[data-dailyhot-theme="dark"] #app {
        background: #101014;
      }

      /* Vue 刚挂载时 Naive Layout 也必须继承 boot theme，避免中间白帧。 */
      html[data-dailyhot-theme="dark"] .n-layout,
      html[data-dailyhot-theme="dark"] .n-layout-scroll-container {
        background-color: #101014 !important;

  <body>
    <div id="app"></div>
    <script>
      (() => {
        const assetRetryParam = "__dailyhot_asset_retry";
        const bootRetryParam = "__dailyhot_boot_retry";
        const currentUrl = new URL(window.location.href);
        let cleanedUrl = false;
        for (const retryParam of [assetRetryParam, bootRetryParam]) {
          if (!currentUrl.searchParams.has(retryParam)) continue;
          currentUrl.searchParams.delete(retryParam);
          cleanedUrl = true;
        }
        if (cleanedUrl) {
          history.replaceState(
            history.state,
            "",
            `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`
          );
        }

        const recoverBoot = async () => {
          if (document.documentElement.dataset.dailyhotMounted === "1") return;
          const storageKey = `dailyhot:boot-retry:${window.location.pathname}`;
          try {
            if (sessionStorage.getItem(storageKey)) return;
            sessionStorage.setItem(storageKey, String(Date.now()));
          } catch {
            // Recovery should still work when session storage is unavailable.
          }

          try {
            if (navigator.serviceWorker) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
            if (window.caches) {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
            }
          } catch {
            // Reloading from the network is still useful if cleanup is partial.
          }

          const retryUrl = new URL(window.location.href);
          retryUrl.searchParams.set(bootRetryParam, String(Date.now()));
          window.location.replace(retryUrl.toString());
        };

        window.setTimeout(() => {
          void recoverBoot();
        }, 12000);

        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const resourceUrl = target?.src || target?.href || "";
            if (!resourceUrl) return;

            let parsedUrl;
            try {
              parsedUrl = new URL(resourceUrl, window.location.href);
            } catch {
              return;
            }
            if (
              parsedUrl.origin !== window.location.origin ||
              !parsedUrl.pathname.startsWith("/assets/")
            ) {
              return;
            }

            const storageKey = `dailyhot:asset-retry:${parsedUrl.pathname}`;
            try {
              if (sessionStorage.getItem(storageKey)) return;
              sessionStorage.setItem(storageKey, String(Date.now()));
            } catch {
              // Recovery should still work when session storage is unavailable.
            }

            const retryUrl = new URL(window.location.href);
            retryUrl.searchParams.set(assetRetryParam, String(Date.now()));
            window.location.replace(retryUrl.toString());
          },
          true
        );
      })();
    </script>
